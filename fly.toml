# Bot chạy song song Telegram Long Polling + HTTP Server cho Telegram Mini App.
app = 'sober-bot'
primary_region = 'nrt'

[env]
  TZ = "Asia/Ho_Chi_Minh"
  PORT = "8080"
  WEBAPP_ENABLED = "true"
  WEBAPP_URL = "https://sober-bot.fly.dev"

[build]

[processes]
  app = "python main.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[deploy]
  strategy = "immediate"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
